name: Build and Release CCloud

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag to create release for (e.g., v1.0.0)'
        required: true
        default: 'v1.0.0'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Make gradlew executable
        run: |
          chmod +x gradlew

      - name: Make scripts executable
        run: |
          chmod +x scripts/*.sh

      - name: Validate Gradle Wrapper
        run: |
          ./scripts/verify-gradle-wrapper.sh
        continue-on-error: true
        timeout-minutes: 5

      - name: Retry Gradle Wrapper Validation (if needed)
        run: |
          echo "Checking if Gradle wrapper validation is needed..."
          # If the previous step failed, try a manual validation approach
          if [ ! -f "gradle/wrapper/gradle-wrapper.jar.sha256" ]; then
            echo "Gradle wrapper checksum missing, generating new one..."
            ./scripts/fix-gradle-wrapper.sh
          else
            echo "Gradle wrapper checksum already exists, continuing..."
          fi
        continue-on-error: true

      - name: Check Gradle Wrapper Validation Result
        run: |
          if [ ! -f "gradle/wrapper/gradle-wrapper.jar.sha256" ]; then
            echo "Gradle wrapper checksum missing, generating new one..."
            cd gradle/wrapper
            sha256sum gradle-wrapper.jar > gradle-wrapper.jar.sha256
          fi

      - name: Setup Gradle
        uses: gradle/gradle-build-action@v2
        with:
          gradle-version: wrapper

      - name: Configure release signing
        env:
          KEY_STORE_B64: ${{ secrets.KEY_STORE }}
          KEY_STORE_PASSWORD: ${{ secrets.KEY_STORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
        run: |
          set -euo pipefail
          if [[ -z "$KEY_STORE_B64" || -z "$KEY_STORE_PASSWORD" || -z "$KEY_PASSWORD" || -z "$KEY_ALIAS" ]]; then
            echo "Release signing secrets are required; refusing to publish an APK with a temporary signing key."
            exit 1
          fi
          printf '%s' "$KEY_STORE_B64" | base64 --decode > app/keystore.jks
          keytool -list -keystore app/keystore.jks -storepass "$KEY_STORE_PASSWORD" -alias "$KEY_ALIAS" >/dev/null
          {
            printf 'storePassword=%s\n' "$KEY_STORE_PASSWORD"
            printf 'keyPassword=%s\n' "$KEY_PASSWORD"
            printf 'keyAlias=%s\n' "$KEY_ALIAS"
            printf 'storeFile=keystore.jks\n'
          } > key.properties

      - name: Build APK
        env:
          TMDB_TOKEN: ${{ secrets.TMDB_TOKEN }}
        run: |
          ./gradlew testTvOptimizedUnitTest assembleRelease --stacktrace -x lint

      - name: Rename APK
        run: |
          test -s app/build/outputs/apk/release/app-universal-release.apk
          mkdir -p release
          cp app/build/outputs/apk/release/app-universal-release.apk release/CCloud-universal.apk
          unzip -t release/CCloud-universal.apk >/dev/null

      - name: Get tag name
        id: get_tag
        env:
          INPUT_TAG: ${{ inputs.tag }}
        run: |
          if [[ $GITHUB_EVENT_NAME == 'workflow_dispatch' ]]; then
            TAG_NAME="$INPUT_TAG"
          else
            TAG_NAME=${GITHUB_REF#refs/tags/}
          fi
          if [[ ! "$TAG_NAME" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Release tag must use vMAJOR.MINOR.PATCH."
            exit 1
          fi
          echo "TAG_NAME=$TAG_NAME" >> $GITHUB_ENV
          echo "Tag name: $TAG_NAME"

      - name: Create Release
        id: create_release
        uses: softprops/action-gh-release@v1
        with:
          tag_name: ${{ env.TAG_NAME }}
          name: Release ${{ env.TAG_NAME }}
          draft: false
          prerelease: false
          files: |
            release/CCloud-universal.apk
          body: |
            ## CCloud Release ${{ env.TAG_NAME }}
            
            ### What's New
            - One universal APK for Android phones/tablets and Android TV
            - Cinematic home, improved title details, and TMDB genre discovery
            - Progressive genre pagination follows TMDB's reported page count
            
            ### Download Options
            - [Universal APK for Android and Android TV](https://github.com/${{ github.repository }}/releases/download/${{ env.TAG_NAME }}/CCloud-universal.apk)

            ### Installation
            1. Download the appropriate APK file for your device
            2. Enable "Install from unknown sources" in your device settings
            3. Open and install the APK
            4. Launch CCloud and enjoy your movies!
